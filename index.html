<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luis Ricardo Santos | Governança de TI e IA que roda</title>
    <meta name="description" content="Luis Ricardo Santos é Gerente de Governança de TI e IA e DPO na Tech for Humans. Transforma burocracia em ferramenta e processo que rodam, com IA quando ela ajuda." />
    <meta name="author" content="Luis Ricardo Santos" />
    <link rel="canonical" href="https://luisr.com.br/" />
    <meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)" />

    <!-- Com JS, o HTML pré-renderizado fica escondido até o React montar
         por cima (evita piscar o desktop numa tela de celular). Sem JS, aparece. -->
    <style>.js #root[data-prerendered] { visibility: hidden; }</style>

    <!-- Tema: aplica a escolha salva antes da primeira pintura (evita flash) -->
    <script>
      document.documentElement.classList.add("js")
      ;(function () {
        try {
          var t = localStorage.getItem("theme")
          if (t === "light" || t === "dark") {
            document.documentElement.setAttribute("data-theme", t)
          }
        } catch (e) {}
      })()
    </script>

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Luis Ricardo Santos | Governança de TI e IA que roda" />
    <meta property="og:description" content="Luis Ricardo Santos é Gerente de Governança de TI e IA e DPO na Tech for Humans. Transforma burocracia em ferramenta e processo que rodam, com IA quando ela ajuda." />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:image" content="https://luisr.com.br/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://luisr.com.br/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Luis Ricardo Santos | Governança de TI e IA que roda" />
    <meta name="twitter:description" content="Luis Ricardo Santos é Gerente de Governança de TI e IA e DPO na Tech for Humans. Transforma burocracia em ferramenta e processo que rodam, com IA quando ela ajuda." />
    <meta name="twitter:image" content="https://luisr.com.br/og-image.png" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
