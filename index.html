    <!-- Tema: aplica a escolha salva antes da primeira pintura (evita flash) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme")
          if (t === "light" || t === "dark") {
            document.documentElement.setAttribute("data-theme", t)
          }
        } catch (e) {}
      })()
    </script>
