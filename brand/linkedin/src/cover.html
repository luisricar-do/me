<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../substack/src/base.css"><style>
/*
 * Capa do LinkedIn: 1584×396, exportada em 2x.
 *
 * No app do celular a capa aparece com ~24% do tamanho (375px de largura),
 * então nada aqui tem menos de 26px: vira ~6px no celular e ~13px no
 * desktop. Título a 80px fica ~19px no celular. A foto de perfil cobre a
 * metade de baixo da faixa x<520 nos dois formatos, por isso o texto começa
 * em x=560.
 */
html,body{width:1584px;height:396px}
body{background:
  radial-gradient(42% 120% at 80% 115%, rgba(14,53,157,.62) 0%, transparent 70%),
  radial-gradient(26% 70% at 100% 0%, rgba(255,96,106,.12) 0%, transparent 70%),
  radial-gradient(30% 90% at 0% 0%, rgba(123,155,255,.07) 0%, transparent 70%),
  #0b0b0d}
.dots{position:absolute;inset:0;
  background-image:radial-gradient(rgba(237,236,232,.075) 1.4px, transparent 1.6px);
  background-size:28px 28px;
  -webkit-mask-image:linear-gradient(90deg, transparent 0%, #000 32%, #000 60%, transparent 90%);
          mask-image:linear-gradient(90deg, transparent 0%, #000 32%, #000 60%, transparent 90%)}
.label{position:absolute;left:562px;top:62px;font-size:26px;letter-spacing:.1em}
.label b{color:#ff606a;font-weight:500}
h1{position:absolute;left:556px;top:100px;font-size:80px;line-height:90px}
.url{position:absolute;left:562px;top:300px;font-family:"JetBrains Mono",monospace;font-weight:500;font-size:28px;letter-spacing:.04em;color:#a3a19b}
.bars{right:76px;bottom:64px;gap:12px;height:268px}
.bars i{width:44px}
</style></head><body>
<div class="dots"></div>
<p class="label">Governança de TI e IA <b>·</b> DPO</p>
<h1 class="display">Construo os sistemas<br>que <em>preciso governar.</em></h1>
<p class="url">luisr.com.br</p>
<div class="bars"><i style="height:23%"></i><i style="height:46%"></i><i style="height:70%"></i><i style="height:100%"></i></div>
</body></html>
