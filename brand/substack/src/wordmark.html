<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
/* Wordmark do cabeçalho: fundo transparente, recorte justo, legível pequeno */
html,body{width:880px;height:200px;background:transparent!important}
body{display:flex;align-items:center;justify-content:center;gap:34px;color:#1a1917}
.bars{position:static;gap:9px;height:118px}
.bars i{width:27px;border-radius:5px}
.bars i:nth-child(1){background:#d6d3cb}
.bars i:nth-child(2){background:#b4b0a6}
.bars i:nth-child(3){background:#8a867c}
h1{font-size:136px;line-height:1;margin-top:-14px}
</style></head><body>
<div class="bars"><i style="height:24%"></i><i style="height:47%"></i><i style="height:72%"></i><i style="height:100%"></i></div>
<h1 class="display">Big <em>Rick</em></h1>
</body></html>
